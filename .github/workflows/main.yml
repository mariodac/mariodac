name: Generate Profile Visuals and Stats

on:
  schedule:
    - cron: "0 6 * * *" # Executa todos os dias às 06:00 UTC
  
  workflow_dispatch:
  
  push:
    branches:
      - master

jobs:
  generate:
    permissions: 
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Clone repo
        uses: actions/checkout@v3
        
      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: mariodac
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      - name: push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # NOVO PASSO: Criação dos cartões visuais do WakaTime
      - name: Generate WakaTime Graphical Cards
        uses: LauraAllObe/wakatimeReadmeStats@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHOW_CARD: "true"
          CARD_TYPE: "wakatime"
          THEME: "teal_neon" # Opções: dark, light, radical, frost_steel, etc.
